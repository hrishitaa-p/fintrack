<h1>FinTrack</h1>

<label>Crypto ID:</label>
<input id="crypto-id" value="bitcoin">

<label>Quantity:</label>
<input id="quantity" type="number" value="0.05">

<label>Buy Price:</label>
<input id="buy-price" type="number" value="65000">

<button onclick="updatePrice()">Update Price</button>

<h2>Results</h2>
<p>Live Price: <span id="live-price">--</span></p>
<p>Current Value: <span id="current-value">--</span></p>
<p>Profit/Loss: <span id="profit-loss">--</span></p>
<p>Return %: <span id="return-percent">--</span></p>
<p>Last Updated: <span id="last-updated">--</span></p>

<script src="script.js"></script>
